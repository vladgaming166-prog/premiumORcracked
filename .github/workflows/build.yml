name: Build

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew --no-daemon clean test assemble
      - name: Upload plugin jars
        uses: actions/upload-artifact@v4
        with:
          name: premiumorcracked-plugins
          path: |
            velocity/build/libs/*.jar
            paper/build/libs/*.jar
